<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tactical Support System v3.2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pastelBlue: { 50: '#F0F9FF', 100: '#E0F2FE', 200: '#BAE6FD', 300: '#7DD3FC', 400: '#38BDF8', 500: '#0EA5E9' },
                        pastelOrange: { 50: '#FFF7ED', 100: '#FFEDD5', 200: '#FED7AA', 300: '#FDBA74', 400: '#FB923C' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Outfit', sans-serif; touch-action: pan-y; overflow-x: hidden; }
    </style>
</head>
<body class="bg-[#FFF7ED] text-slate-800 antialiased selection:bg-pastelBlue-200">

<div class="max-w-md mx-auto min-h-screen bg-white shadow-2xl relative flex flex-col overflow-x-hidden">

    <!-- LOGIN SECTION -->
    <section id="login-section" class="flex-grow flex flex-col justify-center items-center p-8 text-center bg-[#FFF7ED]">
        <div class="w-full max-w-xs space-y-8">
            <div class="space-y-4">
                <div class="w-20 h-20 bg-white rounded-full mx-auto flex items-center justify-center shadow-sm border border-orange-100">
                    <span class="text-3xl">✨</span>
                </div>
                <div class="space-y-1">
                    <span class="font-['Caveat'] text-3xl text-pastelBlue-500 block">
                        Hello, <span id="welcome-name">Who is this?</span>
                    </span>
                    <h2 class="text-xl font-extrabold text-slate-800 tracking-tight">Are you Kairo or Oilove?</h2>
                    <p class="text-xs text-slate-400">Input your name with her/him name as password </p>
                </div>
            </div>

            <div class="space-y-3">
                <input type="text" id="username" placeholder="Username" 
                    class="w-full px-6 py-4 rounded-2xl border border-slate-100 bg-white/80 shadow-sm text-center font-semibold text-slate-600 focus:outline-none focus:ring-2 focus:ring-pastelBlue-200 transition-all">
                
                <input type="password" id="password" placeholder="Password" 
                    class="w-full px-6 py-4 rounded-2xl border border-slate-100 bg-white/80 shadow-sm text-center font-semibold text-slate-600 focus:outline-none focus:ring-2 focus:ring-pastelBlue-200 transition-all"
                    onkeydown="if(event.key === 'Enter') authLogin()">
                
                <button onclick="authLogin()" 
                    class="w-full py-4 bg-slate-800 text-white font-bold rounded-2xl shadow-lg active:scale-95 transition-all hover:bg-slate-700 text-sm tracking-wide">
                    Let's Go!
                </button>
            </div>
        </div>
    </section>

    <!-- MENU SECTION -->
    <section id="menu-section" class="hidden flex-grow flex flex-col justify-center items-center p-8 text-center bg-[#FFF7ED]">
        <div class="w-full max-w-xs space-y-6">
            <div class="space-y-2">
                <span class="font-['Caveat'] text-3xl text-pastelBlue-500 block">
                    Welcome back<span id="welcome-name-menu">!</span> ✨
                </span>
                <h2 class="text-xl font-extrabold text-slate-800 tracking-tight">What's the plan for today?</h2>
                <p class="text-xs text-slate-400">Choose your current destination route</p>
            </div>

            <div class="grid gap-4">
                <button onclick="openMessageStage()" 
                    class="group p-5 rounded-3xl bg-white border border-slate-100 shadow-sm hover:shadow-md transition-all text-left flex items-center gap-4 active:scale-[0.98]">
                    <div class="w-12 h-12 rounded-2xl bg-sky-50 flex items-center justify-center text-xl group-hover:scale-110 transition-transform">💌</div>
                    <div>
                        <p class="font-bold text-slate-800 text-sm">Read Messages</p>
                        <p class="text-[11px] text-slate-400">Deep thoughts & logs</p>
                    </div>
                </button>

                <button onclick="openDistractingStage()" 
                    class="group p-5 rounded-3xl bg-white border border-slate-100 shadow-sm hover:shadow-md transition-all text-left flex items-center gap-4 active:scale-[0.98]">
                    <div class="w-12 h-12 rounded-2xl bg-orange-50 flex items-center justify-center text-xl group-hover:scale-110 transition-transform">🎮</div>
                    <div>
                        <p class="font-bold text-slate-800 text-sm">Mini Distracting</p>
                        <p class="text-[11px] text-slate-400">Relaxing features & zone</p>
                    </div>
                </button>
            </div>
            
            <div class="pt-4">
                <button onclick="triggerFullReset()" class="text-[10px] font-bold text-slate-400 hover:text-rose-500 tracking-widest uppercase transition-colors">
                    Logout Session
                </button>
            </div>
        </div>
    </section>
</div>

<script src="supabase.js"></script>
<script src="auth.js"></script>
</body>
</html>
